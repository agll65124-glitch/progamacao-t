<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Central Operador - Multiview</title>

<style>
body{
    background:#0a0a0a;
    color:#ccc;
    font-family:Arial;
    text-align:center;
}

/* MULTIVIEW */
.multiview{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap:10px;
    width:900px;
    margin:20px auto;
}

.source{
    background:#111;
    border:4px solid #333;
    padding:5px;
    cursor:pointer;
}

.source video,
.source img{
    width:100%;
    height:140px;
    object-fit:cover;
}

.source span{
    display:block;
    margin-top:4px;
    font-size:14px;
}

.preview{
    border-color:yellow !important;
}

.program{
    border-color:red !important;
}

/* PROGRAM GRANDE */
.program-monitor{
    width:600px;
    height:340px;
    margin:20px auto;
    background:#222;
    border:12px solid #555;
    display:flex;
    align-items:center;
    justify-content:center;
}

.program-monitor video,
.program-monitor img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* BOTÕES */
button{
    padding:6px 14px;
    margin:6px;
    background:#222;
    color:#ccc;
    border:1px solid #555;
    cursor:pointer;
}

button:hover{
    background:#333;
}

/* LUZ NO AR */
#onair{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#400;
    display:inline-block;
    margin-left:8px;
}
.on{
    background:red !important;
}
</style>
</head>

<body>

<h2>Central de Controle - Multiview</h2>
NO AR <div id="onair"></div>

<!-- MULTIVIEW -->
<div class="multiview" id="multiview"></div>

<!-- PROGRAM -->
<div class="program-monitor" id="programContainer"></div>

<button onclick="cut()">CUT</button>

<script>
const sources = [
    {name:"CAM 1", file:"abertura.mp4"},
    {name:"CAM 2", file:"infantil_abertura.mp4"},
    {name:"VTR 1", file:"infantil_programa.mp4"},
    {name:"VTR 2", file:"desenho_abertura.mp4"},
    {name:"VTR 3", file:"desenho.mp4"},
    {name:"SLIDE 1", file:"color_bars.png"}
];

let multiview = document.getElementById("multiview");
let programContainer = document.getElementById("programContainer");
let onair = document.getElementById("onair");

let previewIndex = null;
let programIndex = null;

/* CRIAR MULTIVIEW */
sources.forEach((src,index)=>{

    let box = document.createElement("div");
    box.classList.add("source");
    box.dataset.index = index;

    if(src.file.endsWith(".png") || src.file.endsWith(".jpg")){
        let img = document.createElement("img");
        img.src = src.file;
        box.appendChild(img);
    }else{
        let video = document.createElement("video");
        video.src = src.file;
        video.autoplay = true;
        video.muted = true;
        video.loop = true;
        box.appendChild(video);
    }

    let label = document.createElement("span");
    label.innerText = src.name;
    box.appendChild(label);

    box.onclick = () => setPreview(index);

    multiview.appendChild(box);
});

/* SET PREVIEW */
function setPreview(index){

    document.querySelectorAll(".source").forEach(s=>s.classList.remove("preview"));

    previewIndex = index;
    document.querySelectorAll(".source")[index].classList.add("preview");
}

/* CUT */
function cut(){

    if(previewIndex === null) return;

    programContainer.innerHTML = "";
    let src = sources[previewIndex];

    if(src.file.endsWith(".png") || src.file.endsWith(".jpg")){
        let img = document.createElement("img");
        img.src = src.file;
        programContainer.appendChild(img);
    }else{
        let video = document.createElement("video");
        video.src = src.file;
        video.autoplay = true;
        video.controls = false;
        programContainer.appendChild(video);
    }

    document.querySelectorAll(".source").forEach(s=>s.classList.remove("program"));
    document.querySelectorAll(".source")[previewIndex].classList.add("program");

    programIndex = previewIndex;
    previewIndex = null;

    document.querySelectorAll(".source").forEach(s=>s.classList.remove("preview"));

    onair.classList.add("on");
}

/* ATALHOS TECLADO */
let keyBuffer = "";
let bufferTimeout;

const commands = {
    "cam1": () => setPreview(0),
    "cam2": () => setPreview(1),
    "vtr1": () => setPreview(2),
    "vtr2": () => setPreview(3),
    "vtr3": () => setPreview(4),
    "slide1": () => setPreview(5),
    "cut": () => cut()
};

document.addEventListener("keydown", function(e){

    keyBuffer += e.key.toLowerCase();

    clearTimeout(bufferTimeout);
    bufferTimeout = setTimeout(()=> keyBuffer="",2000);

    for(let cmd in commands){
        if(keyBuffer.endsWith(cmd)){
            commands[cmd]();
            keyBuffer="";
        }
    }
});
</script>

</body>
</html>
