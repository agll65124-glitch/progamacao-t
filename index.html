<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Switcher com GC</title>

<style>
body{
    background:#0a0a0a;
    color:#ccc;
    font-family:Arial;
    text-align:center;
}

/* PROGRAM */
.program-monitor{
    width:700px;
    height:400px;
    margin:20px auto;
    background:#222;
    border:12px solid #555;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}

.program-monitor video,
.program-monitor img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* LOWER THIRD */
.lower-third{
    position:absolute;
    bottom:-120px;
    left:0;
    width:100%;
    height:100px;
    background:linear-gradient(to right,#c40000,#ff0000);
    color:white;
    padding:15px 25px;
    box-sizing:border-box;
    transition:bottom 0.5s ease;
}

.lower-third.show{
    bottom:0;
}

.lower-third h2{
    margin:0;
    font-size:24px;
}

.lower-third p{
    margin:5px 0 0 0;
    font-size:16px;
}

/* CONTROLES */
.gc-panel{
    margin-top:20px;
}

input{
    padding:6px;
    margin:5px;
    width:200px;
}

button{
    padding:6px 14px;
    margin:5px;
    background:#222;
    color:#ccc;
    border:1px solid #555;
    cursor:pointer;
}

button:hover{
    background:#333;
}
</style>
</head>

<body>

<h2>Switcher com Gerador de Caracteres</h2>

<div class="program-monitor" id="programContainer">

    <!-- LOWER THIRD -->
    <div class="lower-third" id="lowerThird">
        <h2 id="gcName">Nome Aqui</h2>
        <p id="gcTitle">Cargo Aqui</p>
    </div>

</div>

<!-- CONTROLE GC -->
<div class="gc-panel">
    <input type="text" id="nameInput" placeholder="Nome">
    <input type="text" id="titleInput" placeholder="Cargo">

    <br>

    <button onclick="showGC()">MOSTRAR GC</button>
    <button onclick="hideGC()">OCULTAR GC</button>
</div>

<script>

/* SIMULAÇÃO DE VÍDEO BASE */
let programContainer = document.getElementById("programContainer");

let video = document.createElement("video");
video.src = "abertura.mp4";  // coloque seu vídeo aqui
video.autoplay = true;
video.loop = true;
programContainer.insertBefore(video, programContainer.firstChild);

/* GERADOR DE CARACTERES */

function showGC(){

    let name = document.getElementById("nameInput").value;
    let title = document.getElementById("titleInput").value;

    document.getElementById("gcName").innerText = name;
    document.getElementById("gcTitle").innerText = title;

    document.getElementById("lowerThird").classList.add("show");
}

function hideGC(){
    document.getElementById("lowerThird").classList.remove("show");
}

</script>

</body>
</html>
