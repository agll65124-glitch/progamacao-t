<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Central Operador</title>

<style>
body{
    background:#0a0a0a;
    color:#ccc;
    font-family:Arial;
    text-align:center;
}

/* TV Program */
.tv{
    width:460px;
    height:300px;
    margin:20px auto;
    background:#222;
    border:14px solid #555;
    border-radius:25px;
    box-shadow:0 0 50px black inset;
    display:flex;
    align-items:center;
    justify-content:center;
}

.tv video{
    width:380px;
    height:240px;
    background:black;
    object-fit:cover;
}

/* Preview */
.preview-box{
    margin-top:20px;
}

.preview-box video{
    width:260px;
    height:160px;
    background:black;
    border:3px solid #444;
}

/* Botões */
button{
    padding:6px 14px;
    margin:4px;
    background:#222;
    color:#ccc;
    border:1px solid #555;
    cursor:pointer;
}

button:hover{
    background:#333;
}

.previewActive{
    background:yellow;
    color:black;
}

.programActive{
    background:red;
    color:white;
}

/* Luz NO AR */
#onair{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#400;
    display:inline-block;
    margin-left:8px;
}
.on{
    background:red !important;
}
</style>
</head>

<body>

<h3>Central de Controle</h3>
NO AR <div id="onair"></div>

<!-- PROGRAM -->
<div class="tv">
    <video id="program"></video>
</div>

<!-- PREVIEW -->
<div class="preview-box">
    <h4>PREVIEW</h4>
    <video id="preview" muted></video>
</div>

<br>

<button onclick="setPreview(this,'abertura.mp4')">CAM 1</button>
<button onclick="setPreview(this,'infantil_abertura.mp4')">CAM 2</button>
<button onclick="setPreview(this,'infantil_programa.mp4')">VTR 1</button>
<button onclick="setPreview(this,'desenho_abertura.mp4')">VTR 2</button>
<button onclick="setPreview(this,'desenho.mp4')">VTR 3</button>
<button onclick="setPreview(this,'color_bars')">SLIDE 1</button>

<br><br>

<button onclick="cut()">CUT</button>

<script>
let preview = document.getElementById("preview");
let program = document.getElementById("program");
let onair = document.getElementById("onair");

let currentPreviewBtn = null;
let currentProgramBtn = null;

function setPreview(button,file){
    preview.src = file;
    preview.load();
    preview.play();

    if(currentPreviewBtn){
        currentPreviewBtn.classList.remove("previewActive");
    }

    button.classList.add("previewActive");
    currentPreviewBtn = button;
}

function cut(){
    if(!preview.src) return;

    program.src = preview.src;
    program.currentTime = preview.currentTime;
    program.load();
    program.play();

    onair.classList.add("on");

    if(currentProgramBtn){
        currentProgramBtn.classList.remove("programActive");
    }

    if(currentPreviewBtn){
        currentPreviewBtn.classList.remove("previewActive");
        currentPreviewBtn.classList.add("programActive");
        currentProgramBtn = currentPreviewBtn;
        currentPreviewBtn = null;
    }
}
</script>

</body>
</html>
