<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Central Operador</title>

<style>
body{
    background:#0a0a0a;
    color:#ccc;
    font-family:Arial;
    text-align:center;
}

/* TV Program */
.tv{
    width:460px;
    height:300px;
    margin:20px auto;
    background:#222;
    border:14px solid #555;
    border-radius:25px;
    box-shadow:0 0 50px black inset;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.tv video, .tv img{
    width:380px;
    height:240px;
    object-fit:cover;
}

/* Preview */
.preview-box{
    margin-top:20px;
}

.preview-box video,
.preview-box img{
    width:260px;
    height:160px;
    background:black;
    border:3px solid #444;
    object-fit:cover;
}

/* Botões */
button{
    padding:6px 14px;
    margin:4px;
    background:#222;
    color:#ccc;
    border:1px solid #555;
    cursor:pointer;
}

button:hover{
    background:#333;
}

.previewActive{
    background:yellow;
    color:black;
}

.programActive{
    background:red;
    color:white;
}

/* Luz NO AR */
#onair{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#400;
    display:inline-block;
    margin-left:8px;
}
.on{
    background:red !important;
}
</style>
</head>

<body>

<h1 style="color:red;font-size:40px;">TESTE SLIDE 1</h1>

<h3>Central de Controle</h3>
NO AR <div id="onair"></div>

<!-- PROGRAM -->
<div class="tv" id="programContainer"></div>

<!-- PREVIEW -->
<div class="preview-box">
    <h4>PREVIEW</h4>
    <div id="previewContainer"></div>
</div>

<br>

<button onclick="setPreview(this,'abertura.mp4')">CAM 1</button>
<button onclick="setPreview(this,'infantil_abertura.mp4')">CAM 2</button>
<button onclick="setPreview(this,'infantil_programa.mp4')">VTR 1</button>
<button onclick="setPreview(this,'desenho_abertura.mp4')">VTR 2</button>
<button onclick="setPreview(this,'desenho.mp4')">VTR 3</button>
<button onclick="setPreview(this,'color_bars.png')">SLIDE 1</button>

<br><br>

<button onclick="cut()">CUT</button>

<script>
let previewContainer = document.getElementById("previewContainer");
let programContainer = document.getElementById("programContainer");
let onair = document.getElementById("onair");

let currentPreviewBtn = null;
let currentProgramBtn = null;
let previewFile = null;

function setPreview(button,file){

    previewFile = file;
    previewContainer.innerHTML = "";

    if(file.endsWith(".png") || file.endsWith(".jpg")){
        let img = document.createElement("img");
        img.src = file;
        previewContainer.appendChild(img);
    } else {
        let video = document.createElement("video");
        video.src = file;
        video.autoplay = true;
        video.muted = true;
        previewContainer.appendChild(video);
    }

    if(currentPreviewBtn){
        currentPreviewBtn.classList.remove("previewActive");
    }

    button.classList.add("previewActive");
    currentPreviewBtn = button;
}

function cut(){

    if(!previewFile) return;

    programContainer.innerHTML = "";

    if(previewFile.endsWith(".png") || previewFile.endsWith(".jpg")){
        let img = document.createElement("img");
        img.src = previewFile;
        programContainer.appendChild(img);
    } else {
        let video = document.createElement("video");
        video.src = previewFile;
        video.autoplay = true;
        programContainer.appendChild(video);
    }

    onair.classList.add("on");

    if(currentProgramBtn){
        currentProgramBtn.classList.remove("programActive");
    }

    if(currentPreviewBtn){
        currentPreviewBtn.classList.remove("previewActive");
        currentPreviewBtn.classList.add("programActive");
        currentProgramBtn = currentPreviewBtn;
        currentPreviewBtn = null;
    }
}
</script>

</body>
</html>
